name: Novyra tests

on:
  push:
    branches: [develop/0.3.0]
  pull_request:
    branches: [main, develop/0.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and tests
        run: python -m py_compile novyra.py test_novyra.py
      - name: Run test suite with ResourceWarning treated as error
        run: python -W error::ResourceWarning test_novyra.py
